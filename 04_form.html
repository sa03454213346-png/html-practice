<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <h1>student login form</h1>
    <form method="post" >
        <label for="email">
            email:
            <input placeholder="@gmail.com" type="email" name="email" >
        </label>
        <label for="password">
            password:
            <input placeholder="1234" type="password" name="password" >
        </label>
        <label for="username">
            username:
            <input placeholder="sajjad133" type="text" name="username" >
        </label>
        <input type="reset" value="reset">
        <input type="submit" value="submit">
        <input type="checkbox" name="box" id="">

    </form>
    <h2>for games</h2>
    <div>
        <form >
            <label for="games">
                write fave games:
                <input placeholder="enter fav game"  type="text" name="game" id="game1">
                <input  type="checkbox" name="" id="">
                <input placeholder="enter fav game" type="text" name="game" id="game2">
                <input  type="checkbox" name="" id="">
                <input placeholder="enter fav game" type="text" name="game" id="game3">
                <input  type="checkbox" name="" id="">
                
            </label>
            <input type="submit" value="submit">

        </form>
    </div>
    <h3>for other inputs</h3>
    <form >
        <div>
            <label for="calendar">
                calendar:
                <input type="date" name="calendar" id="calendar">
            </label>
            <input type="color" name="" id="">
            <input type="image" src="image.png/1765023874015.jpg" alt="my photo" width="30">
            <input type="file" name="" id="">
            <input type="radio" name="" id="">
            <input type="number" name="" id="" placeholder="0300xxxxx">
            <input type="week" name="" id="">
            <input type="search" name="" id="" placeholder="search for your favourite things">


        </div>
    </form>
    <h3>selection of games</h3>
    <form >
        <div>
            <label for="selection of games">
                <select name="games" id="">
                    <option value="basketboll">basketboll</option>
                    <option value="cricekt">cricekt</option>
                </select>   
            </label>
            <input type="radio" name="" id="">
        </div>
    </form>
</body>
</html>
